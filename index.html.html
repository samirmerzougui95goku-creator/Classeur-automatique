html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sky);color:var(--ink);font:500 1rem/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-ic]{display:grid;font-style:normal}
.i{display:block;width:22px;height:22px}
.sky{position:fixed;inset:0;z-index:0;background:var(--sky-g)}
.clouds{position:fixed;z-index:0;left:50%;bottom:0;width:min(100vw,640px);aspect-ratio:600/474;transform:translateX(-50%);transform-origin:50% 100%;background:var(--bank) center bottom/100% 100% no-repeat;pointer-events:none}
html .clouds.push{animation:push var(--dur,1.1s) ease both}
@media (min-width:700px){.clouds{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}}
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-bottom:130px}
.top{display:block;padding:18px 16px 12px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--lg1),var(--lg2));color:#EAF1FF}
.logo .i{width:20px;height:20px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.seg button{height:34px;padding:0 11px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:.8rem;font-weight:700;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--segbg);color:var(--segink)}
.srch{display:flex;align-items:center;gap:10px;height:48px;margin:0 16px 14px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.07);color:var(--muted)}
.srch:focus-within{border-color:var(--accent)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);-webkit-appearance:none;appearance:none}
.srch input::placeholder,#f ::placeholder{color:var(--muted)}
.mrow{padding:0 16px 10px}
#tabs{position:relative;display:flex;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
#ind{position:absolute;left:0;top:2px;width:0;height:40px;border-radius:12px;border:1px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 24%,var(--deep));transition:transform .5s cubic-bezier(.3,.8,.2,1),width .5s cubic-bezier(.3,.8,.2,1),border-color .4s,background .4s}
#chips{display:flex;gap:6px}
.chip{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 13px;border:1px solid transparent;border-radius:12px;background:none;color:var(--muted);font-size:.86rem;font-weight:700;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;font-size:.75rem;opacity:.75}
.chip[aria-pressed=true]{color:#fff}
.ttl{display:flex;align-items:baseline;gap:10px;margin:6px 16px 12px;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.ttl small{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:0}
#list{padding:0 14px}
.mail{position:relative;display:flex;gap:12px;margin-bottom:8px;padding:13px 14px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:16px;background:var(--row);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.mail.rd{background:var(--rowrd);border-left-color:color-mix(in srgb,var(--c) 40%,transparent)}
.mail:active{background:var(--press)}
.av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--a) 30%,var(--deep));border:1px solid color-mix(in srgb,var(--a) 70%,transparent);color:#fff;font-weight:800}
.mc{flex:1;min-width:0}
.l1{display:flex;align-items:baseline;gap:8px}
.from{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.tm{flex:none;font-size:.75rem;font-weight:700;color:var(--accent)}
.rd .from,.rd .tm{font-weight:600}
.rd .tm{color:var(--muted)}
.subj{margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem;font-weight:700}
.rd .subj{font-weight:500}
.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem;color:var(--muted)}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px}
.lb{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-size:.72rem;font-weight:800}
.lb::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.dm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.75rem;color:var(--muted)}
.fav{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:-4px -6px -4px 0;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer}
.fav .i{width:20px;height:20px}
.fav.on{color:var(--gold)}
.enter .mail{animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + var(--i)*55ms)}
.empty{display:grid;justify-items:center;gap:6px;padding:36px 24px;border:1px solid var(--line);border-radius:16px;background:var(--row);text-align:center;color:var(--muted)}
.empty .i{width:44px;height:44px;color:var(--accent)}
.empty b{color:var(--ink);font-size:1.05rem}
.foot{margin:14px 14px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--row);font-size:.78rem;color:var(--muted)}
#reset{display:block;margin-top:6px;padding:6px 0;border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
.fab{position:fixed;z-index:5;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;height:54px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--accent);color:var(--onacc);font-weight:800;box-shadow:0 12px 28px -10px rgba(0,0,0,.7);cursor:pointer}
.fab:active{transform:scale(.97)}
.ov{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bank) center bottom/min(100vw,640px) auto no-repeat,var(--sky);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:ovIn .4s cubic-bezier(.2,.8,.2,1) both}
.ov.out{animation:ovOut .3s ease-in both}
#new,#themes{background:var(--sky);animation-name:upIn}
#new.out,#themes.out{animation-name:upOut}
.bar{display:flex;align-items:center;gap:6px;height:56px;max-width:640px;margin:0 auto;padding:0 6px}
.bar h2{flex:1;margin:0;font-size:1.1rem;font-weight:800}
.sp{flex:1}
.ib{flex:none;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer}
.doc{max-width:640px;margin:0 auto;padding:0 18px 40px}
.vs{margin:6px 0 10px;font-size:1.45rem;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.vm{display:flex;gap:12px;align-items:center;padding:14px 0}
.mu{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.vb{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--row);white-space:pre-wrap;line-height:1.65}
.mvl{display:flex;align-items:center;gap:8px;height:38px;margin-right:8px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);color:var(--muted);font-size:.82rem;font-weight:700}
.mvl select{border:0;background:none;color:var(--ink);font-size:.86rem;font-weight:800;cursor:pointer}
.mvl select option{color:var(--segink)}
.send{height:40px;margin-right:8px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--onacc);font-weight:800;cursor:pointer}
#f{display:flex;flex-direction:column;min-height:100%;max-width:640px;margin:0 auto}
.fld{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
.fld:focus-within{border-bottom-color:var(--accent)}
.fld span{width:56px;color:var(--muted);font-size:.9rem;font-weight:700}
.fld input{flex:1;min-width:0;height:54px;border:0;outline:0;background:none}
#f textarea{flex:1;min-height:240px;padding:16px 18px;border:0;outline:0;background:none;line-height:1.6;resize:none}
#snack{position:fixed;z-index:90;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--segbg);color:var(--segink);font-size:.86rem;font-weight:800;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);animation:snIn .35s both}
.veil{--w:100vw;--hb:calc(var(--w)*.79);--th:calc(var(--hb)*2 + 160vh);position:fixed;left:0;top:0;width:100%;height:var(--th);z-index:80;pointer-events:none;transform:translateY(100vh);will-change:transform}
.veil.run{animation:pass var(--dur,1.1s) cubic-bezier(.45,.05,.55,.95) both}
.cb{position:absolute;left:0;right:0;height:var(--hb);background:var(--vb,var(--bank)) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.cb.t{top:0}
.cb.f{bottom:0;transform:scaleY(-1)}
.cm{position:absolute;left:0;right:0;top:calc(var(--hb)*.7);bottom:calc(var(--hb)*.7);background:radial-gradient(var(--dots) 1.1px,transparent 1.6px) 0 0/5px 5px,var(--vm,var(--mid))}
.conn{display:flex;align-items:center;gap:12px;margin:0 16px 14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--row);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.conn b{display:block;font-size:.95rem}
.conn span{display:block;margin-top:2px;font-size:.8rem;line-height:1.35;color:var(--muted)}

function classify(m){
  const subj=norm(m.s),rest=norm((m.b||'')+' '+(m.e||''));
  let best='autres',top=0;
  CATS.forEach(c=>{
    let sc=0;
    c.kw.forEach(k=>{const re=new RegExp('\\b'+k);if(re.test(subj))sc+=2;if(re.test(rest))sc+=1});
    if(sc>top){top=sc;best=c.id}
  });

  const was=m.sp+':'+m.c;
  try{
    const mcp=await mcpTool();
    const p=payload(await mcp.callTool('Gmail','get_message',{messageId:m.mid,messageFormat:'PLAIN_TEXT'}));
    const body=typeof p.plaintextBody==='string'?cleanBody(p.plaintextBody):'';
    if(body){m.full=body;if(!m.man)route(m)}
  }catch(e){}
  return m.sp+':'+m.c!==was;
}
let rq=[],rn=0,dirty=false;
function queueRead(list){list.forEach(m=>{if(m.mid&&!m.rt&&!rq.includes(m))rq.push(m)});pumpRead()}
function pumpRead(){
  while(rn<2&&rq.length){
    const m=rq.shift();rn++;
    readOne(m).then(ch=>{
      rn--;if(ch)dirty=true;
      if(!rq.length&&!rn&&dirty){dirty=false;save();state.mails=loadMails();renderNav();renderList()}
      pumpRead();
    });
  }
}
function renderConn(){
  const c=$('#conn'),L=state.live;
  if(L.on){
    c.className='conn ok';
    c.innerHTML=`<i class="dot"></i><div style="flex:1;min-width:0"><b>${L.loading?'Connexion à Gmail…':'Gmail connecté'}</b>${L.acct?`<span>${esc(L.acct)}</span>`:''}<span>${L.last?'À jour à '+esc(L.last)+'. ':''}Les nouveaux mails sont lus et rangés tout seuls tant que cette page est ouverte.</span></div><button type="button" class="lk" id="gref"${L.loading?' disabled':''}>Actualiser</button><button type="button" class="lk" id="gout">Déconnecter</button>`;
  }else{
    c.className='conn';
    c.innerHTML=`<div style="flex:1;min-width:0"><b>Recevez vos vrais mails</b><span>Connectez Gmail : chaque nouveau mail est lu puis rangé dans son domaine, pour le quotidien comme pour l’entreprise (lecture seule).</span></div><button type="button" class="go" id="gconn">Se connecter</button>`;
  }
}
let syncing=false,unwatch=null,chain=Promise.resolve();
const AUTHZ=['needs_reauth','server_not_connected','server_not_found','blocked_by_policy','approval_required','not_in_manifest','consent_required','not_granted','selection_required','unavailable'];
function stopWatch(){if(unwatch){unwatch();unwatch=null}}
function gmErr(e){
  const c=e&&e.code;
  if(AUTHZ.includes(c)||!state.live.ready){
    stopWatch();
    state.live={on:false,loading:false,items:[],next:'',ready:false};
    try{localStorage.removeItem('classeur-gmail')}catch(x){}
    state.mails=loadMails();render(true,.1);
    showErr(c==='unavailable'?(e&&e.message)||'La connexion à Gmail est indisponible.':(ERR[c]||'La connexion à Gmail a échoué. Réessayez dans un instant.')+(c?' ['+c+']'+(e&&e.message?' '+e.message:''):''));
  }else showErr((ERR[c]||WAIT)+' ['+(c||'erreur')+'] Les mails déjà reçus restent affichés.');
}
async function startWatch(){
  let mcp;try{mcp=await mcpTool()}catch(e){gmErr(e);return}
  stopWatch();
  unwatch=mcp.watchTool('Gmail','search_threads',INPUT,ev=>{if(ev.type==='data')onData(ev.result);else gmErr(ev.error)},{refetchInterval:30000});
}
function onData(r){chain=chain.then(()=>ingest(payload(r),r&&r.cache?r.cache.storedAt:Date.now())).catch(()=>{})}
async function ingest(p,ts){
  const L=state.live;if(!L.on)return;
  showErr('');
  const ov=readOv()||{},th=Array.isArray(p.threads)?p.threads:[];
  const stamp=new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const items=th.map(t=>toMail(t,ov));
  L.last=stamp;
  if(!L.ready){
    L.items=items;L.next=p.nextPageToken||'';L.ready=true;L.loading=false;
    const np=items.filter(m=>m.sp==='particulier').length,ne=items.length-np;
    const first=()=>{
      try{localStorage.setItem('classeur-gmail','1')}catch(e){}
      const want=np>=ne?'particulier':'entreprise';
      if(want!==state.profile){state.profile=want;applyProfile();try{localStorage.setItem('classeur-profile',want)}catch(e){}}
      state.mails=loadMails();state.mode='theme';state.filter='all';state.q='';$('#q').value='';
      render(true,.25);
      snack(items.length?'Gmail connecté : '+items.length+' mails rangés ('+np+' quotidien, '+ne+' entreprise).':'Gmail connecté, mais la boîte de réception est vide.');
      queueRead(items.slice(0,24));
    };
    if(L.user)pass(first);else first();
    return;
  }
  const have=new Map(L.items.map(m=>[m.id,m])),fresh=[];
  items.forEach(m=>{
    const old=have.get(m.id);
    if(!old)fresh.push(m);
    else if(old.mid!==m.mid){Object.assign(old,{mid:m.mid,s:m.s,b:m.b,t:m.t,r:m.r,full:'',rt:0,url:m.url||old.url});if(!old.man)route(old);fresh.push(old)}
    else if(m.r&&!old.r)old.r=1;
  });
  if(!fresh.length){state.mails=loadMails();renderNav();renderList();return}
  await Promise.all(fresh.map(m=>Promise.race([readOne(m),new Promise(r=>setTimeout(r,8000))])));
  fresh.forEach(m=>{m.isNew=true});
  const ids=new Set(fresh.map(m=>m.id));
  L.items=fresh.concat(L.items.filter(m=>!ids.has(m.id)));
  save();state.mails=loadMails();
  renderNav();renderList();
  const m=fresh[0],n=fresh.length;
  snack(n>1?n+' nouveaux mails rangés.':'Nouveau mail de '+m.n+' : rangé dans '+quote(catOf(m).name)+(m.sp!==state.profile?' ('+(m.sp==='particulier'?'quotidien':'entreprise')+')':'')+'.');
  setTimeout(()=>{fresh.forEach(x=>{x.isNew=false});document.querySelectorAll('.mail.new').forEach(e=>e.classList.remove('new'))},7000);
}
async function connectGmail(){
  if(syncing)return;
  syncing=true;showErr('');
  const L=state.live;L.on=true;L.loading=true;L.user=true;L.ready=false;
  renderConn();renderList();
  try{
    const mcp=await mcpTool();
    const r=await mcp.callTool('Gmail','search_threads',INPUT);
    syncing=false;
    await startWatch();
    onData(r);
  }catch(e){syncing=false;gmErr(e)}
}
async function refreshNow(){try{const mcp=await mcpTool();await mcp.invalidate()}catch(e){}}
async function moreGmail(){
  if(syncing||!state.live.next)return;
  syncing=true;
  const b=$('#more');if(b){b.disabled=true;b.textContent='Chargement…'}
  try{
    const p=await fetchPage(state.live.next);
    const ov=readOv()||{},seen=new Set(state.live.items.map(m=>m.id)),add=[];
    (p.threads||[]).forEach(t=>{const m=toMail(t,ov);if(!seen.has(m.id)){state.live.items.push(m);add.push(m)}});
    state.live.next=p.nextPageToken||'';
    state.mails=loadMails();renderNav();queueRead(add.slice(0,12));
  }catch(e){showErr(ERR[e&&e.code]||'Impossible de charger plus de mails pour le moment.')}
  syncing=false;renderList();
}
function disconnectGmail(){
  stopWatch();rq=[];gmSignOut();
  pass(()=>{
    state.live={on:false,loading:false,items:[],next:'',ready:false};
    try{localStorage.removeItem('classeur-gmail');localStorage.removeItem('classeur-ov')}catch(e){}
    state.mails=loadMails();state.mode='theme';state.filter='all';state.q='';$('#q').value='';
    render(true,.25);
    snack('Gmail déconnecté de Classeur.');
  });
}
const TH={
nuages:{n:'Nuages',d:'Ciel de nuit calme',u:1100},
montagnes:{n:'Montagnes',d:'Étoiles filantes et lune',u:1200},
ocean:{n:'Océan',d:'Vagues, bulles et rayons',u:1300},
foret:{n:'Forêt',d:'Lucioles dans la nuit',u:1200},
dunes:{n:'Dunes',d:'Soleil couchant et sable',u:1250},
hiver:{n:'Hiver',d:'Neige qui tombe',u:1100}
};
let THID='nuages';
function setDur(id){DUR=TH[id].u;document.documentElement.style.setProperty('--dur',DUR+'ms')}
function buildFx(id){
  const f=$('#fx');f.innerHTML='';
  if(RM)return;
  const r=(a,b)=>a+Math.random()*(b-a);
  const add=(c,o)=>{const e=document.createElement('i');e.className=c;for(const k in o)e.style.setProperty(k,o[k]);f.appendChild(e)};
  const N={hiver:44,montagnes:34,foret:20,ocean:14,dunes:10,nuages:16}[id];
  for(let i=0;i<N;i++){
    const x=r(0,100)+'%';
    if(id==='hiver')add('sn',{'--x':x,'--s':r(2,5)+'px','--d':r(7,14)+'s','--dl':-r(0,12)+'s','--w':r(-40,40)+'px','--o':r(.5,.95)});
    else if(id==='montagnes')add('st',{'--x':x,'--y':r(0,48)+'%','--s':r(1,2.6)+'px','--d':r(1.5,4)+'s','--dl':-r(0,4)+'s','--o':r(.5,1)});
    else if(id==='foret')add('ff',{'--x':x,'--y':r(30,92)+'%','--s':r(2.5,4.5)+'px','--d':r(5,11)+'s','--dl':-r(0,9)+'s','--w':r(-60,60)+'px','--h':r(-90,-20)+'px'});
    else if(id==='ocean')add('bb',{'--x':x,'--y':r(55,100)+'%','--s':r(5,12)+'px','--d':r(10,20)+'s','--dl':-r(0,18)+'s','--w':r(-30,30)+'px'});
    else if(id==='dunes')add('dm',{'--x':'0%','--y':r(20,85)+'%','--s':r(1.5,3)+'px','--d':r(12,24)+'s','--dl':-r(0,20)+'s','--h':r(-60,20)+'px'});
    else add('st',{'--x':x,'--y':r(0,40)+'%','--s':r(1,2.2)+'px','--d':r(2,5)+'s','--dl':-r(0,5)+'s','--o':r(.3,.7)});
  }
  if(id==='montagnes'){add('sh',{'--d':'11s','--dl':'3s'});add('moon',{})}
  if(id==='dunes')add('sunx',{});
  if(id==='ocean')[['20%','0s'],['52%','-3s'],['78%','-6s']].forEach(a=>add('ray',{'--x':a[0],'--dl':a[1]}));
}
function applyTheme(id){
  THID=id;document.documentElement.dataset.th=id;setDur(id);
  try{localStorage.setItem('classeur-theme',id)}catch(e){}
  buildFx(id);
  document.querySelectorAll('.tc').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===id)));
}
function pickTheme(id){
  if(busy||id===THID||!TH[id])return;
  const v=$('#veil');
  v.style.setProperty('--vb','var(--b-'+id+')');v.style.setProperty('--vm','var(--m-'+id+')');
  setDur(id);hideOv('#themes');
  pass(()=>{applyTheme(id);snack('Thème '+TH[id].n+' activé.')});
  setTimeout(()=>{v.style.removeProperty('--vb');v.style.removeProperty('--vm')},DUR+250);
}

document.querySelectorAll('[data-ic]').forEach(el=>{el.innerHTML=ic(el.dataset.ic)});
try{if(localStorage.getItem('classeur-profile')==='particulier')state.profile='particulier';}catch(e){}
$('#tg').innerHTML=Object.keys(TH).map(id=>`<button type="button" class="tc" data-th="${id}" aria-pressed="false"><span class="tp" style="--b:var(--b-${id});--g:var(--sg-${id})"></span><b>${TH[id].n}</b><span class="td">${TH[id].d}</span></button>`).join('');
try{const t=localStorage.getItem('classeur-theme');if(t&&TH[t])THID=t}catch(e){}
applyTheme(THID);
applyProfile();
state.mails=loadMails();
render(true,.1);
if(state.live.on)startWatch();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
addEventListener('resize',moveInd);
</script>
